<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 07 - Manipulation du DOM</title>
  <script defer src="./main.js"></script>
</head>

<body>
  <main>
    <h1>Manipulation du DOM</h1>
    <hr>
    <button id="helloWorldBtn">Click me !</button>
    <hr>
    <div>
      <label for="firstName">Prenom: </label>
      <input type="text" id="firstName" name="firstName" placeholder="John">
    </div>
    <div>
      <label for="lastName">Nom de famille: </label>
      <input type="text" id="lastName" name="lastName" placeholder="DOE">
    </div>
    <div>
      <label for="age">Age: </label>
      <input type="number" min="0" max="200" id="age" name="age">
    </div>
    <div>
      <button id="addUserBtn">Ajouter utilisateur</button>
    </div>
    <hr>
    <h2>Liste des utilisateurs</h2>
    <ul id="userListUL"></ul>
    <hr>
    <h2>Test Fetch</h2>
    <button id="testFetchBtn">Click me!</button>
  </main>
</body>

</html>
